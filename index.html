<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChemLab – Interactive Chemistry</title>
  <meta name="description" content="Learn chemistry with lessons, simulations, calculators and quizzes: atomic structure, bonding, stoichiometry, gas laws, thermochemistry and electrochemistry.">
  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('chemlab:theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/home.css">
  <link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <noscript><p style="padding:2rem">ChemLab needs JavaScript to run.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
